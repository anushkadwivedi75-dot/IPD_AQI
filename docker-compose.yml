services:
  db:
    image: postgis/postgis:16-3.4
    container_name: airsentine1_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airsentine1}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airsentine1}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airsentine1_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airsentine1_api
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-AirSentine1 API}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-airsentine1}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/airsentine1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - airsentine1_net

  frontend:
    build:
      context: ./airsentine1
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-}
    container_name: airsentine1_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - airsentine1_net

volumes:
  postgres_data:
    name: airsentine1_postgres_data

networks:
  airsentine1_net:
    name: airsentine1_network
    driver: bridge
